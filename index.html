    <footer><p id="status" aria-live="polite">轻按空格钓近岸，按住时看准落点再松开。</p><button id="action" type="button"><kbd>空格</kbd><span id="action-label">甩竿</span></button></footer>
    <section class="journal" aria-labelledby="journal-title">
      <div class="journal-header"><h2 id="journal-title">鱼图鉴</h2><p id="journal-summary">已发现 0 / 3 种</p></div>
      <ul class="journal-cards">
        <li class="journal-card" id="journal-carp"><svg class="fish-icon" viewBox="0 0 40 30" aria-hidden="true"><use href="#journal-fish"/></svg><div><strong>鲫鱼</strong><small>近岸</small><span id="count-carp">尚未钓到</span></div></li>
        <li class="journal-card" id="journal-bass"><svg class="fish-icon" viewBox="0 0 40 30" aria-hidden="true"><use href="#journal-fish"/></svg><div><strong>鲈鱼</strong><small>深水</small><span id="count-bass">尚未钓到</span></div></li>
        <li class="journal-card" id="journal-koi"><svg class="fish-icon" viewBox="0 0 40 30" aria-hidden="true"><use href="#journal-fish"/></svg><div><strong>金鲤</strong><small>深水 · 少见</small><span id="count-koi">尚未钓到</span></div></li>
      </ul>
      <div id="koi-challenge" class="challenge">
        <div><strong>小挑战 · 抓准时机</strong><p>等金鲤的鱼漂往岸边横移，按空格，然后把它钓上岸。</p></div>
        <span id="challenge-badge">待完成</span>
      </div>
